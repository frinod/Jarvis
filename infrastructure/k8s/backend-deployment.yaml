apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jarvis-backend
  template:
    metadata:
      labels:
        app: jarvis-backend
    spec:
      containers:
        - name: backend
          image: jarvis-os/backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jarvis-secrets
                  key: database-url
            - name: REDIS_URL
              value: redis://redis-service:6379/0
            - name: QDRANT_URL
              value: http://qdrant-service:6333
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-backend-service
spec:
  selector:
    app: jarvis-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
